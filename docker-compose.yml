services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: datalake-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    restart: unless-stopped

  datalake:
    build:
      context: .
      dockerfile: Dockerfile
    image: datalake:latest
    container_name: datalake
    depends_on:
      - elasticsearch

    # Environment variables (isolated per container)
    environment:
      - DATA_DIR=/data
      - DB_FILE=/data/datalake.db
      - LOG_DIR=/app/logs
      - PROJECT_ROOT=/app
      - SCHEMA_FILE=/app/schema.sql
      - ELASTICSEARCH_URL=http://elasticsearch:9200

    # Volume mounts
    volumes:
      # Persistent data storage
      - datalake-data:/data
      # Logs
      - datalake-logs:/app/logs
      # Database (optional: can also be in /data)
      - datalake-db:/app/db

    # Expose API port
    ports:
      - "8766:8766"

    # Keep container running for interactive use
    stdin_open: true
    tty: true

    # Default command: run API server
    command: ["/usr/local/bin/uv", "run", "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8766"]

    # Restart policy
    restart: unless-stopped

    # Resource limits (optional)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

volumes:
  elasticsearch-data:
    driver: local
  datalake-data:
    driver: local
  datalake-logs:
    driver: local
  datalake-db:
    driver: local
